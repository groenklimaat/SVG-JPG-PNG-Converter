<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — PNG Converter</title>

<link rel="icon" type="image/svg+xml" href="./icon.svg">
<meta name="theme-color" content="#4a7dff">

<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f4f5f7;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #222;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    position: relative;
  }
  .lang-switch {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 12px;
    padding: 5px 8px;
    border: 1px solid #d5d8dd;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
  }
  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    display: block;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  h1 { margin: 0 0 12px; font-size: 22px; }
  p { margin: 0 0 12px; color: #555; font-size: 15px; line-height: 1.5; }
  button {
    margin-top: 20px;
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    background: #4a7dff;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }
  button:hover { background: #3a6aeb; }
</style>
</head>
<body>
  <div class="card">
    <select class="lang-switch" id="langSwitch" aria-label="Language"></select>

    <!-- Icoon: gouden recycle-kroon -->
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PNG Converter">
      <defs>
        <linearGradient id="bgB2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#15803d"/>
          <stop offset="100%" stop-color="#22c55e"/>
        </linearGradient>
        <linearGradient id="goldB" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff4b8"/>
          <stop offset="35%" stop-color="#f5c542"/>
          <stop offset="70%" stop-color="#d4a017"/>
          <stop offset="100%" stop-color="#a67c00"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="112" fill="url(#bgB2)"/>
      <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
        <path d="M 180 210 L 332 210"/>
        <path d="M 332 210 L 332 362"/>
        <path d="M 332 362 L 180 362"/>
        <path d="M 180 362 L 180 210"/>
        <path d="M 316 194 L 340 210 L 316 226"/>
        <path d="M 316 346 L 332 370 L 348 346"/>
        <path d="M 196 346 L 172 362 L 196 378"/>
        <path d="M 196 194 L 180 210 L 196 226"/>
      </g>
      <g font-family="system-ui, sans-serif" font-size="48" font-weight="800" text-anchor="middle" dominant-baseline="central" stroke="#7a5900" stroke-width="1.8" paint-order="stroke fill">
        <rect x="156" y="150" width="200" height="80" rx="20" fill="#ffffff"/>
        <text x="256" y="192" fill="url(#goldB)">SVG</text>
        <rect x="56" y="342" width="200" height="80" rx="20" fill="#ffffff"/>
        <text x="156" y="384" fill="url(#goldB)">JPG</text>
        <rect x="256" y="342" width="200" height="80" rx="20" fill="#ffffff"/>
        <text x="356" y="384" fill="url(#goldB)">PNG</text>
      </g>
      <g transform="translate(256 286)">
        <rect x="-10" y="-36" width="20" height="48" rx="5" fill="url(#goldB)"/>
        <path d="M-24 -6 L0 22 L24 -6 Z" fill="url(#goldB)"/>
      </g>
      <g transform="translate(256 105)" fill="url(#goldB)" stroke="#7a5900" stroke-width="3" stroke-linejoin="round" paint-order="stroke fill">
        <path d="M -70 20 L -70 -20 L -35 0 L 0 -35 L 35 0 L 70 -20 L 70 20 Z"/>
        <rect x="-75" y="22" width="150" height="14" rx="6"/>
        <circle cx="-70" cy="-24" r="8" stroke-width="2"/>
        <circle cx="0" cy="-40" r="8" stroke-width="2"/>
        <circle cx="70" cy="-24" r="8" stroke-width="2"/>
      </g>
    </svg>

    <h1 id="offTitle">You are offline</h1>
    <p id="offText1"></p>
    <p id="offText2"></p>
    <button id="offBtn" onclick="location.reload()"></button>
  </div>

<script>
const T = {
  en: {
    title: "You are offline",
    t1: "There is currently no internet connection. The app continues to work for previously loaded parts, but some features (like ZIP export via CDN) may be temporarily unavailable.",
    t2: "Connect to the internet and try again.",
    btn: "Try again"
  },
  nl: {
    title: "Je bent offline",
    t1: "Er is momenteel geen internetverbinding. De app blijft werken voor eerder geladen onderdelen, maar sommige functies (zoals de ZIP-export via CDN) kunnen tijdelijk niet beschikbaar zijn.",
    t2: "Maak verbinding met internet en probeer het opnieuw.",
    btn: "Opnieuw proberen"
  },
  fr: {
    title: "Vous êtes hors ligne",
    t1: "Il n'y a actuellement aucune connexion Internet. L'application continue de fonctionner pour les parties déjà chargées, mais certaines fonctions (comme l'export ZIP via CDN) peuvent être temporairement indisponibles.",
    t2: "Connectez-vous à Internet et réessayez.",
    btn: "Réessayer"
  },
  de: {
    title: "Du bist offline",
    t1: "Es besteht derzeit keine Internetverbindung. Die App funktioniert weiterhin für bereits geladene Teile, aber einige Funktionen (wie der ZIP-Export über CDN) sind möglicherweise vorübergehend nicht verfügbar.",
    t2: "Stelle eine Internetverbindung her und versuche es erneut.",
    btn: "Erneut versuchen"
  },
  es: {
    title: "Estás sin conexión",
    t1: "Actualmente no hay conexión a Internet. La aplicación sigue funcionando para las partes ya cargadas, pero algunas funciones (como la exportación ZIP vía CDN) pueden no estar disponibles temporalmente.",
    t2: "Conéctate a Internet e inténtalo de nuevo.",
    btn: "Reintentar"
  },
  pt: {
    title: "Está offline",
    t1: "De momento não há ligação à Internet. A aplicação continua a funcionar para as partes já carregadas, mas algumas funcionalidades (como a exportação ZIP via CDN) podem estar temporariamente indisponíveis.",
    t2: "Ligue-se à Internet e tente novamente.",
    btn: "Tentar novamente"
  },
  sv: {
    title: "Du är offline",
    t1: "Det finns för närvarande ingen internetanslutning. Appen fortsätter att fungera för redan laddade delar, men vissa funktioner (som ZIP-export via CDN) kan vara tillfälligt otillgängliga.",
    t2: "Anslut till internet och försök igen.",
    btn: "Försök igen"
  },
  no: {
    title: "Du er offline",
    t1: "Det er for øyeblikket ingen internettforbindelse. Appen fortsetter å fungere for allerede lastede deler, men noen funksjoner (som ZIP-eksport via CDN) kan være midlertidig utilgjengelige.",
    t2: "Koble til internett og prøv igjen.",
    btn: "Prøv igjen"
  },
  uk: {
    title: "Ви офлайн",
    t1: "Наразі немає підключення до Інтернету. Додаток продовжує працювати для вже завантажених частин, але деякі функції (наприклад, експорт ZIP через CDN) можуть бути тимчасово недоступними.",
    t2: "Підключіться до Інтернету та спробуйте знову.",
    btn: "Спробувати знову"
  },
  zh: {
    title: "您已离线",
    t1: "当前没有互联网连接。该应用会继续为已加载的部分工作，但某些功能（例如通过 CDN 导出 ZIP）可能暂时不可用。",
    t2: "请连接互联网后重试。",
    btn: "重试"
  },
  ja: {
    title: "オフラインです",
    t1: "現在インターネットに接続されていません。アプリは既に読み込まれた部分については動作を続けますが、一部の機能（CDN 経由の ZIP エクスポートなど）は一時的に利用できない場合があります。",
    t2: "インターネットに接続して再試行してください。",
    btn: "再試行"
  }
};

const LANG_NAMES = {
  en: "English", nl: "Nederlands", fr: "Français", de: "Deutsch",
  es: "Español", pt: "Português", sv: "Svenska", no: "Norsk",
  uk: "Українська", zh: "中文", ja: "日本語"
};

function pickLang() {
  const saved = localStorage.getItem('logo2png_lang');
  if (saved && T[saved]) return saved;
  const short = (navigator.language || 'en').toLowerCase().split('-')[0];
  if (T[short]) return short;
  if (navigator.language.startsWith('zh')) return 'zh';
  if (navigator.language.startsWith('ja')) return 'ja';
  return 'en';
}

function apply(code) {
  const tr = T[code] || T.en;
  document.documentElement.lang = code;
  document.title = tr.title + " — PNG Converter";
  document.getElementById('offTitle').textContent = tr.title;
  document.getElementById('offText1').textContent = tr.t1;
  document.getElementById('offText2').textContent = tr.t2;
  document.getElementById('offBtn').textContent = tr.btn;
}

const sel = document.getElementById('langSwitch');
Object.keys(LANG_NAMES).forEach(code => {
  const o = document.createElement('option');
  o.value = code;
  o.textContent = LANG_NAMES[code];
  sel.appendChild(o);
});
const initial = pickLang();
sel.value = initial;
apply(initial);
sel.addEventListener('change', () => {
  localStorage.setItem('logo2png_lang', sel.value);
  apply(sel.value);
});
</script>
</body>
</html>
