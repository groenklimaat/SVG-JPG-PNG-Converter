    border-radius: 8px;
    background: #fff;

  p.sub {

    gap: 16px;
    margin-top: 24px;

  label { font-size: 13px; color: #333; font-weight: 600; display: block; margin-bottom: 6px; }
  select {

    border: 1px solid #d5d8dd;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;

    background: #f8f9fb;
    border-radius: 10px;

    background: #fff;
    border: 1px solid #d5d8dd;
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: 0.15s;
  }
  .size-chip:has(input:checked) {
    background: #4a7dff;
    color: #fff;
    border-color: #4a7dff;
  }
  .size-chip input { margin: 0; accent-color: #fff; }

  .custom-add {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .custom-add input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #d5d8dd;
    border-radius: 8px;
    font-size: 13px;
  }
  .custom-add button {
    margin: 0;
    width: auto;
    padding: 8px 14px;
    font-size: 13px;
    background: #6b7280;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .custom-add button:hover { background: #4b5563; }

  .checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    margin-top: 16px;
    color: #333;
  }
  .checkbox input { width: 16px; height: 16px; }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 24px;
  }
  .btn-row button {
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;

  #downloadZip:hover:not(:disabled) { background: #3a6aeb; }
  #downloadZip:disabled { background: #c9ccd1; cursor: not-allowed; }

  #downloadLoose { background: #e5e7eb; color: #333; }
  #downloadLoose:hover:not(:disabled) { background: #d5d8dd; }
  #downloadLoose:disabled { background: #f0f0f0; color: #aaa; cursor: not-allowed; }

    color: #666;

    font-size: 13px;
    color: #4a7dff;
    text-align: center;

const LANG_NAMES = {
  en: "English", nl: "Nederlands", fr: "Français", de: "Deutsch",
  es: "Español", pt: "Português", sv: "Svenska", no: "Norsk",
  uk: "Українська", zh: "中文", ja: "日本語"
};

let currentLang = 'en';

function detectLanguage() {
  const saved = localStorage.getItem('logo2png_lang');
  if (saved && TRANSLATIONS[saved]) return saved;
  const browser = (navigator.language || 'en').toLowerCase();
  const short = browser.split('-')[0];
  if (TRANSLATIONS[short]) return short;
  if (browser.startsWith('zh')) return 'zh';
  if (browser.startsWith('ja')) return 'ja';
  return 'en';
}

function t(key, vars) {
  let str = (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key])
         || TRANSLATIONS.en[key] || key;
  if (vars) {
    Object.keys(vars).forEach(k => {
      str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
    });
  }
  return str;
}

function applyTranslations() {
  document.documentElement.lang = currentLang;
  document.title = t('title') + " — Logo, JPG & SVG to PNG";
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
  });
  renderAll();
}

function buildLangSwitcher() {
  const sel = document.getElementById('langSwitch');
  sel.innerHTML = '';
  Object.keys(LANG_NAMES).forEach(code => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = LANG_NAMES[code];
    sel.appendChild(opt);
  });
  sel.value = currentLang;
  sel.addEventListener('change', () => {
    currentLang = sel.value;
    localStorage.setItem('logo2png_lang', currentLang);
    applyTranslations();
  });
}

/* =========================================================
   APP LOGIC
   ========================================================= */
const fileInput   = document.getElementById('file');
const dropZone    = document.getElementById('drop');
const modeSelect  = document.getElementById('mode');
const bgColor     = document.getElementById('bg');
const transparent = document.getElementById('transparent');
const iconVersion = document.getElementById('iconVersion');
const zipBtn      = document.getElementById('downloadZip');
const looseBtn    = document.getElementById('downloadLoose');
const previews    = document.getElementById('previews');
const sizesGrid   = document.getElementById('sizesGrid');
const customSize  = document.getElementById('customSize');
const addSizeBtn  = document.getElementById('addSize');
const status      = document.getElementById('status');

let currentImage = null;
let fileName     = 'logo';

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

async function handleFile(file) {
  fileName = file.name.replace(/\.[^.]+$/, '');
  const isSVG = file.type === 'image/svg+xml' || file.name.toLowerCase().endsWith('.svg');

  if (isSVG) {
    const text = await file.text();
    const blob = new Blob([text], { type: 'image/svg+xml' });
    const url  = URL.createObjectURL(blob);
    const img  = new Image();
    img.onload = () => {
      if (!img.naturalWidth || !img.naturalHeight) { img.width = 512; img.height = 512; }
      currentImage = img;
      URL.revokeObjectURL(url);
      renderAll();
    };
    img.onerror = () => alert(t('alertSvgError'));
    img.src = url;
  } else {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { currentImage = img; URL.revokeObjectURL(url); renderAll(); };
    img.src = url;
  }
}

addSizeBtn.addEventListener('click', () => {
  const v = parseInt(customSize.value);
  if (!v || v < 16 || v > 4096) { alert(t('alertInvalidSize')); return; }
  const existing = [...sizesGrid.querySelectorAll('input[type=checkbox]')].find(cb => +cb.value === v);
  if (existing) { existing.checked = true; customSize.value = ''; renderAll(); return; }

  const label = document.createElement('label');
  label.className = 'size-chip';
  label.innerHTML = `<input type="checkbox" value="${v}" checked> ${v} × ${v}`;
  sizesGrid.appendChild(label);
  label.querySelector('input').addEventListener('change', renderAll);
  customSize.value = '';
  renderAll();
});

function getSelectedSizes() {
  return [...sizesGrid.querySelectorAll('input[type=checkbox]:checked')]
    .map(cb => +cb.value)
    .sort((a, b) => b - a);
}

function drawOnCanvas(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  if (transparent.checked) {
    ctx.clearRect(0, 0, size, size);
  } else {
    ctx.fillStyle = bgColor.value;
    ctx.fillRect(0, 0, size, size);
  }

  const iw = currentImage.naturalWidth  || currentImage.width;
  const ih = currentImage.naturalHeight || currentImage.height;
  const mode = modeSelect.value;

  const isIcon = iconVersion.checked;
  const padding = isIcon ? size * 0.15 : 0;
  const innerSize = size - padding * 2;

  let dx = padding, dy = padding, dw = innerSize, dh = innerSize;

  if (mode === 'contain') {
    const scale = Math.min(innerSize / iw, innerSize / ih);
    dw = iw * scale; dh = ih * scale;
    dx = padding + (innerSize - dw) / 2;
    dy = padding + (innerSize - dh) / 2;
  } else if (mode === 'cover') {
    const scale = Math.max(innerSize / iw, innerSize / ih);
    dw = iw * scale; dh = ih * scale;
    dx = padding + (innerSize - dw) / 2;
    dy = padding + (innerSize - dh) / 2;
  }

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  ctx.save();
  if (mode === 'cover') {
    ctx.beginPath();
    ctx.rect(padding, padding, innerSize, innerSize);
    ctx.clip();
  }
  ctx.drawImage(currentImage, dx, dy, dw, dh);
  ctx.restore();

  return canvas;
}

function renderAll() {
  const sizes = getSelectedSizes();
  looseBtn.textContent = t('downloadLoose');

  if (!currentImage) {
    zipBtn.textContent = t('downloadZip');
    return;
  }

  previews.innerHTML = '';
  previews.style.display = sizes.length ? 'flex' : 'none';

  sizes.forEach(size => {
    const sourceCanvas = drawOnCanvas(size);
    const previewCanvas = document.createElement('canvas');
    previewCanvas.width = size;
    previewCanvas.height = size;
    previewCanvas.getContext('2d').drawImage(sourceCanvas, 0, 0);

    const item = document.createElement('div');
    item.className = 'preview-item';
    item.appendChild(previewCanvas);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = `${size} × ${size}${iconVersion.checked ? t('iconSuffix') : ''}`;
    item.appendChild(label);

    previews.appendChild(item);
  });

  const disabled = sizes.length === 0;
  zipBtn.disabled = disabled;
  looseBtn.disabled = disabled;
  zipBtn.textContent = sizes.length
    ? t('zipButton', { count: sizes.length, label: t(sizes.length === 1 ? 'zipButtonOne' : 'zipButtonMany') })
    : t('downloadZip');
}

function canvasToBlob(canvas) {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

function buildFileName(size) {
  const suffix = iconVersion.checked ? '-icon' : '';
  return `${fileName}_${size}x${size}${suffix}.png`;
}

zipBtn.addEventListener('click', async () => {
  const sizes = getSelectedSizes();
  if (!sizes.length || typeof JSZip === 'undefined') {
    if (typeof JSZip === 'undefined') alert(t('alertJsZipError'));
    return;
  }

  zipBtn.disabled = true;
  const zip = new JSZip();
  const folder = zip.folder(`${fileName}_png`);

  for (let i = 0; i < sizes.length; i++) {
    const size = sizes[i];
    status.textContent = t('statusWorking', { size, current: i + 1, total: sizes.length });
    const canvas = drawOnCanvas(size);
    const blob = await canvasToBlob(canvas);
    folder.file(buildFileName(size), blob);
  }

  status.textContent = t('statusZipCreating');
  const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });

  const url = URL.createObjectURL(zipBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${fileName}_png_${sizes.join('-')}.zip`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);

  status.textContent = t('statusZipDone', { count: sizes.length });
  setTimeout(() => status.textContent = '', 3000);
  zipBtn.disabled = false;
});

looseBtn.addEventListener('click', async () => {
  const sizes = getSelectedSizes();
  if (!sizes.length) return;

  looseBtn.disabled = true;
  for (let i = 0; i < sizes.length; i++) {
    const size = sizes[i];
    status.textContent = t('statusDownloading', { size, current: i + 1, total: sizes.length });
    const canvas = drawOnCanvas(size);
    await new Promise(resolve => {
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = buildFileName(size);
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        resolve();
      }, 'image/png');
    });
    await new Promise(r => setTimeout(r, 250));
  }
  status.textContent = t('statusDownloaded', { count: sizes.length });
  setTimeout(() => status.textContent = '', 3000);
  looseBtn.disabled = false;
});

[modeSelect, bgColor, transparent, iconVersion].forEach(el => el.addEventListener('input', renderAll));
sizesGrid.querySelectorAll('input[type=checkbox]').forEach(cb =>
  cb.addEventListener('change', renderAll)
);
customSize.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addSizeBtn.click(); }
});

currentLang = detectLanguage();
buildLangSwitcher();
applyTranslations();

/* =========================================================
   SERVICE WORKER + auto-update
   ========================================================= */
if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./serviceworker.js')
      .then(reg => {
        console.log('SW registered:', reg.scope);
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              newWorker.postMessage('SKIP_WAITING');
            }
          });
        });
      })
      .catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
